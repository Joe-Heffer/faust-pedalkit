# Builds the documentation site (mkdocs.yml) and publishes it to GitHub Pages.
# The effect pages embed the current test plots and the rendered schematics,
# so the tests, the schematic checks and the rendering run first, all in the
# docs image (Dockerfile.docs), which adds KiCad and MkDocs to the toolchain.
# Pull requests build the site to catch broken links; only main deploys.
# Needs Settings → Pages → Source set to "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deployment part-way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERFILE: Dockerfile.docs
  IMAGE: pedalkit-docs

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build docs image
        run: make image
      - name: Offline tests (plots and CSV data for the effect pages)
        run: make container RUN=test
      - name: Schematic electrical rules check
        run: make container RUN=erc
      - name: Render schematics
        run: make container RUN=schematics
      - name: Build site
        run: make container RUN=docs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
