# Builds the documentation site (mkdocs.yml) and publishes it to GitHub Pages.
# The effect pages embed the current test plots and the rendered schematics,
# so the tests, the schematic checks and the rendering run first, and the
# browser demo (make web) is built, checked and published as demo/. All of it
# runs in the docs image (Dockerfile.docs), which adds KiCad, Node.js and
# MkDocs to the toolchain.
# Pull requests build the site to catch broken links; only main deploys.
# Needs Settings → Pages → Source set to "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Dockerfile"
      - "Dockerfile.docs"
      - ".dockerignore"
      - "Makefile"
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "Dockerfile"
      - "Dockerfile.docs"
      - ".dockerignore"
      - "Makefile"
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
  # A published release changes the download links, so rebuild the site from
  # main (the Pages environment must allow deployments from release events).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deployment part-way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERFILE: Dockerfile.docs
  IMAGE: pedalkit-docs
  # The image is built with a layer cache below, so `make container` doesn't
  # build it again.
  SKIP_IMAGE: "1"
  # Effects build and test in parallel (GitHub's Linux runners have 4 cores).
  JOBS: "-j4"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A release event runs on the tag; the site is always built from main.
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      # KiCad makes this image large and slow to build, so its layers are
      # cached between runs and it is rebuilt only when Dockerfile.docs, its
      # base image or tools/docs-requirements.txt changes.
      - uses: docker/setup-buildx-action@v3
      - name: Build docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.docs
          tags: pedalkit-docs
          load: true
          cache-from: type=gha,scope=pedalkit-docs
          cache-to: type=gha,scope=pedalkit-docs,mode=max
      # Shares its cache with the CI workflow's tests (same key), so a hit
      # skips the tests here. Only passing results are saved.
      - name: Restore test results
        id: tests-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/out
          key: tests-${{ hashFiles('src/**', 'tests/**', 'tools/**', 'Makefile', 'Dockerfile', 'Dockerfile.docs') }}
      - name: Offline tests (plots and CSV data for the effect pages)
        if: steps.tests-cache.outputs.cache-hit != 'true'
        run: make container RUN="$JOBS test"
      - name: Save test results
        if: steps.tests-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/out
          key: ${{ steps.tests-cache.outputs.cache-primary-key }}
      - name: Browser demo (WebAssembly build, checked against the native renderers)
        run: make container RUN="$JOBS web web-test"
      - name: Schematics match their generator scripts
        run: make container RUN=schematic-check
      - name: Schematic electrical rules check
        run: make container RUN=erc
      - name: Render schematics
        run: make container RUN=schematics
      # Every measurement and schematic sheet the pages embed was generated,
      # and every rendered sheet is embedded.
      - name: Measurements and schematics the docs rely on
        run: make container RUN="check-outputs OUTPUTS=measurements,schematics"
      - name: Build site
        run: make container RUN=docs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
