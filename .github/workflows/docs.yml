# Builds the documentation site (mkdocs.yml) and publishes it to GitHub Pages.
# The effect pages embed the current test plots and the rendered schematics,
# so the tests, the schematic checks and the rendering run first, and the
# browser demo (make web) is built, checked and published as demo/. All of it
# runs in the docs image (Dockerfile.docs), which adds KiCad, Node.js and
# MkDocs to the toolchain.
# Pull requests build the site to catch broken links; only main deploys.
# Needs Settings → Pages → Source set to "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Dockerfile"
      - "Dockerfile.docs"
      - ".dockerignore"
      - "Makefile"
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "Dockerfile"
      - "Dockerfile.docs"
      - ".dockerignore"
      - "Makefile"
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
  # A published release changes the download links. docs-release.yml starts this
  # workflow on main for each one: a release event runs on the tag, which the
  # Pages environment's default rule refuses to deploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deployment part-way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERFILE: Dockerfile.docs
  IMAGE: pedalkit-docs

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build docs image
        run: make image
      - name: Offline tests (plots and CSV data for the effect pages)
        run: make container RUN=test
      - name: Browser demo (WebAssembly build, checked against the native renderers)
        run: make container RUN="web web-test"
      - name: Schematics match their generator scripts
        run: make container RUN=schematic-check
      - name: Schematic electrical rules check
        run: make container RUN=erc
      - name: Render schematics
        run: make container RUN=schematics
      # Every measurement and schematic sheet the pages embed was generated,
      # and every rendered sheet is embedded.
      - name: Measurements and schematics the docs rely on
        run: make container RUN="check-outputs OUTPUTS=measurements,schematics"
      # The token lets the release lookup (tools/downloads.py) avoid the
      # anonymous API rate limit.
      - name: Build site
        run: make container RUN=docs CONTAINER_FLAGS="-e GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
