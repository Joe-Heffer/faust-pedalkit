name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # faust-compile needs the Faust compiler, which the build job has.
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: faust-compile

  build-test:
    name: Build, lv2lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain image (Dockerfile) is the same one contributors use with
      # `make container`. Later steps reuse its layer cache.
      - name: Build toolchain image
        run: make image
      - name: Build LV2 bundles
        run: make container RUN=lv2
      - name: lv2lint
        run: make container RUN=lint
      - name: Offline tests
        run: make container RUN=test
      - name: Upload plots and renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: tests/out/
          if-no-files-found: ignore
      - name: Describe effects (JSON and block diagrams)
        run: make container RUN=describe
      - name: Upload effect descriptions
        uses: actions/upload-artifact@v7
        with:
          name: describe
          path: |
            build/*/*.dsp.json
            build/*/*-svg/

  vst3:
    name: VST3 build and pluginval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build toolchain image
        run: make image
      - name: Cache the VST3 SDK
        uses: actions/cache@v6
        with:
          path: build/vst3sdk
          key: vst3sdk-${{ hashFiles('Makefile') }}
      - name: Build VST3 bundles (runs Steinberg's validator)
        run: make container RUN=vst3
      - name: pluginval
        run: make container RUN=pluginval
      - name: Upload VST3 bundles
        uses: actions/upload-artifact@v7
        with:
          name: vst3
          path: build/*.vst3/

  clap:
    name: CLAP build and clap-validator
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
    steps:
      - name: Install toolchain
        # git fetches the CLAP headers; unzip unpacks clap-validator.
        run: |
          pacman -Syu --noconfirm --needed faust git python unzip
          faust --version
      - uses: actions/checkout@v7
      - name: Build CLAP plugins
        run: make clap
      - name: Install clap-validator
        # The release zip wraps a tarball holding the single binary.
        run: |
          curl -sSfL -o /tmp/clap-validator.zip "$CLAP_VALIDATOR_URL"
          unzip -q -d /tmp/clap-validator /tmp/clap-validator.zip
          tar -xzf /tmp/clap-validator/*.tar.gz -C /usr/local/bin clap-validator
          clap-validator --version
      - name: clap-validator
        run: make clap-validate
      - name: Upload CLAP plugins
        uses: actions/upload-artifact@v7
        with:
          name: clap
          path: build/*.clap
