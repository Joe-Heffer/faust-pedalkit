name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # faust-compile needs the Faust compiler, which the build job has.
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: faust-compile

  build-test:
    name: Build, lv2lint and tests
    runs-on: ubuntu-latest
    # Arch matches the development machine and packages current faust and lv2lint.
    container: archlinux:base-devel
    env:
      # faust2lv2 derives its include path from `which faust`; with /usr/sbin
      # first on the container's PATH that becomes /usr/sinclude/faust.
      FAUSTINC: /usr/include/faust
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            faust lv2 lv2lint boost python python-numpy python-matplotlib
          faust --version
      - uses: actions/checkout@v7
      - name: Build LV2 bundles
        run: make lv2
      - name: lv2lint
        run: make lint
      - name: Offline tests
        run: make test
      - name: Upload plots and renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: tests/out/
          if-no-files-found: ignore
      - name: Describe effects (JSON and block diagrams)
        run: make describe
      - name: Upload effect descriptions
        uses: actions/upload-artifact@v5
        with:
          name: describe
          path: |
            build/*/*.dsp.json
            build/*/*-svg/

  vst3:
    name: VST3 build and pluginval
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - name: Install toolchain
        # git and cmake build the bundle against the VST3 SDK; alsa-lib,
        # fontconfig and freetype2 are pluginval's runtime libraries.
        run: |
          pacman -Syu --noconfirm --needed \
            faust cmake git python unzip alsa-lib fontconfig freetype2
          faust --version
      - uses: actions/checkout@v7
      - name: Cache the VST3 SDK
        uses: actions/cache@v6
        with:
          path: build/vst3sdk
          key: vst3sdk-${{ hashFiles('Makefile') }}
      - name: Build VST3 bundles (runs Steinberg's validator)
        run: make vst3
      - name: Install pluginval
        run: |
          curl -sSfL -o /tmp/pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q /tmp/pluginval.zip -d /usr/local/bin
      - name: pluginval
        run: make pluginval
      - name: Upload VST3 bundles
        uses: actions/upload-artifact@v7
        with:
          name: vst3
          path: build/*.vst3/

  clap:
    name: CLAP build and clap-validator
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
    steps:
      - name: Install toolchain
        # git fetches the CLAP headers; unzip unpacks clap-validator.
        run: |
          pacman -Syu --noconfirm --needed faust git python unzip
          faust --version
      - uses: actions/checkout@v7
      - name: Build CLAP plugins
        run: make clap
      - name: Install clap-validator
        # The release zip wraps a tarball holding the single binary.
        run: |
          curl -sSfL -o /tmp/clap-validator.zip "$CLAP_VALIDATOR_URL"
          unzip -q -d /tmp/clap-validator /tmp/clap-validator.zip
          tar -xzf /tmp/clap-validator/*.tar.gz -C /usr/local/bin clap-validator
          clap-validator --version
      - name: clap-validator
        run: make clap-validate
      - name: Upload CLAP plugins
        uses: actions/upload-artifact@v7
        with:
          name: clap
          path: build/*.clap
