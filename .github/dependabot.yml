# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Tracks the actions used in .github/workflows and the base image digests in
# the Dockerfiles at the top level (Dockerfile, Dockerfile.docs and
# Dockerfile.release). The Arch packages in the Arch images are pinned by
# ARCH_SNAPSHOT, which is bumped by hand. There is no Python manifest:
# numpy and matplotlib come from system packages, and pyproject.toml only
# holds tool configuration. Pre-commit hook revisions are not covered by
# Dependabot; use `pre-commit autoupdate` for those.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
