# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Tracks the actions used in .github/workflows, the base image digests in
# the Dockerfiles at the top level (Dockerfile, Dockerfile.docs and
# Dockerfile.release) and the browser demo's npm toolchain (faustwasm, pinned
# in tools/web/package-lock.json). The Arch packages in the Arch images are
# pinned by ARCH_SNAPSHOT, which is bumped by hand. There is no Python manifest:
# numpy and matplotlib come from system packages, and pyproject.toml only
# holds tool configuration. Pre-commit hook revisions are not covered by
# Dependabot; use `pre-commit autoupdate` for those.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Dockerfile.release stays on the oldest Debian that has what the build
      # needs, so that the shipped plugins load on older distributions.
      # Debian 13 (glibc 2.41) builds plugins that need GLIBC_2.38 and fail
      # the Ubuntu 22.04 check. Digest updates within debian:12 still arrive.
      - dependency-name: "debian"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/tools/web"
    schedule:
      interval: "weekly"
