name: Bug report
description: Something fails to build, load, test or measure correctly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got. Paste exact error text.
    validations:
      required: true
  - type: input
    id: effect
    attributes:
      label: Effect
      description: The effect name, e.g. `bassdrive`, or "all".
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it fail?
      options:
        - Build (faust2lv2 / make)
        - lv2lint
        - Loading in a host
        - Offline tests (make test)
        - Measured behaviour (levels, response, aliasing)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, for example `make lv2 lint test FX=bassdrive`, or host and control settings.
      render: shell
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Distribution, `faust --version`, host and version, and sample rate.
      render: text
