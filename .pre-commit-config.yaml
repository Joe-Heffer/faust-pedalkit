# Pre-commit hooks for this repo. Install once with `pre-commit install`;
# run everything with `pre-commit run --all-files`. CI runs the same hooks.
#
# The faust-compile hook needs the `faust` compiler locally. The CI lint job
# skips it because the CI build job compiles every effect anyway.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # GitHub Actions workflows: syntax, expressions, job graph and action inputs.
  # The golang hook builds actionlint itself, so no local Go is needed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      # General typos everywhere.
      - id: codespell
        name: codespell (typos)
        additional_dependencies: [tomli]
      # Hard rule 3: British English in docs, comments and UI text. Only
      # prose-bearing files are checked, so code such as matplotlib's
      # `color=` is not flagged. The ignore-regex lets a cited title keep its
      # published American spelling (Pakarinen and Yeh, 2009).
      - id: codespell
        name: codespell (British English)
        args:
          - --builtin=
          - --dictionary=tools/en-gb.codespell
          - "--ignore-regex=techniques for modeling vacuum-tube"
        files: \.(md|dsp|lib)$

  # Every file has a machine-readable licence (SPDX header or REUSE.toml).
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: local
    hooks:
      # Hard rule: generated files live only in build/ and tests/out/.
      - id: no-generated-files
        name: no generated files (build/, tests/out/)
        language: fail
        entry: generated files belong in build/ or tests/out/ and must not be committed
        files: ^(build|tests/out)/
      # Hard rule 2: no manufacturer or product names in file names, or in
      # src/ and tests/ (declare lines, UI labels, URIs). docs/ may name the
      # reference hardware. Deny-list: tools/trademarks.txt.
      - id: no-trademarks
        name: no trademarks in names and UI text
        language: python
        entry: tools/check-trademarks.py
      # Workflows grant no write scope at the top level, never `write-all`,
      # and pin every action to a version tag or SHA (tools/check-workflows.py).
      - id: workflow-permissions
        name: workflow permissions and action refs
        language: python
        additional_dependencies: [pyyaml]
        entry: tools/check-workflows.py
        files: ^\.github/workflows/.*\.ya?ml$
      # Every effect with circuit notes has a generated KiCad schematic
      # (AGENTS.md, step 6). make schematic-check, in the docs workflow,
      # checks that the committed sheets match their scripts.
      - id: schematics-present
        name: every effect with circuit notes has a schematic
        language: python
        entry: tools/check-schematics.py
        files: ^(docs/[^/]+/(circuit-notes\.md|schematics/)|tools/schematics/)
        pass_filenames: false
      # Released effects keep their controls' labels, types and order, so
      # saved projects and presets recall correctly (tools/check-params.py).
      # Compares with each effect's latest release tag; the CI lint job
      # fetches the tags.
      - id: params-stable
        name: released controls keep their order
        language: python
        entry: tools/check-params.py
        files: ^src/.*\.dsp$
        pass_filenames: false
      # Every effect has what AGENTS.md's new-effect checklist requires:
      # declares, unit and smoothing on each control, latency reporting with
      # oversample4, pk.safety, notes, docs pages and rows, and the minimum
      # tests (tools/check-effects.py).
      - id: effect-checklist
        name: every effect meets the new-effect checklist
        language: python
        entry: tools/check-effects.py
        files: ^(src/|tests/|docs/|README\.md$|mkdocs\.yml$)
        pass_filenames: false
      - id: faust-compile
        name: faust compiles every effect
        language: system
        entry: tools/check-faust.sh
        files: \.(dsp|lib)$
        pass_filenames: false
