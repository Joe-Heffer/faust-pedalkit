# SPDX-FileCopyrightText: 2026 Joe Heffer
# SPDX-License-Identifier: MIT
# Documentation site, published to GitHub Pages by .github/workflows/docs.yml.
#
#   make test web schematics docs   build the site into build/site/ (strict: warnings fail)
#   make docs-serve                 live preview at http://127.0.0.1:8000/
#
# Install the tools with `pip install -r tools/docs-requirements.txt`.
# tools/mkdocs_hooks.py publishes the plots and CSV data from tests/out/ under
# measurements/<name>/, so effect pages can show the current measurements, and
# the schematic sheets from build/schematics/ under schematics/<name>/.
#
# No `!!python/name:` YAML tags here, so the check-yaml hook can parse it.

site_name: Faust Pedal Kit
site_description: >-
  A workshop for designing new guitar and bass effects in Faust, built as
  native Linux LV2 and VST3 plugins and checked by offline measurement tests.
site_author: Joe Heffer
site_url: https://joe-heffer.github.io/faust-pedalkit/
repo_url: https://github.com/Joe-Heffer/faust-pedalkit
repo_name: Joe-Heffer/faust-pedalkit
edit_uri: edit/main/docs/
copyright: >-
  Code: MIT. Documentation: CC BY 4.0. Not affiliated with any pedal
  manufacturer.

docs_dir: docs
site_dir: build/site

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

hooks:
  - tools/mkdocs_hooks.py

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Install and build: install.md
  - Usage:
      - Loading in a host: usage/hosts.md
      - Using the effects in REAPER: usage/reaper.md
      - Trying the effects in a browser: usage/browser.md
      - Designing an effect in the browser: usage/designer.md
  - Effects:
      - effects/index.md
      - BassDrive:
          - bassdrive/index.md
          - Circuit notes: bassdrive/circuit-notes.md
          - Changelog: bassdrive/changelog.md
      - BassPreamp:
          - basspreamp/index.md
          - Circuit notes: basspreamp/circuit-notes.md
          - Changelog: basspreamp/changelog.md
      - MidHump:
          - midhump/index.md
          - Circuit notes: midhump/circuit-notes.md
          - Design notes: midhump/design-notes.md
          - Changelog: midhump/changelog.md
      - BassGrit:
          - bassgrit/index.md
          - Circuit notes: bassgrit/circuit-notes.md
          - Design notes: bassgrit/design-notes.md
          - Changelog: bassgrit/changelog.md
      - BassEras:
          - basseras/index.md
          - Circuit notes: basseras/circuit-notes.md
          - Design notes: basseras/design-notes.md
          - Changelog: basseras/changelog.md
  - Development:
      - development/index.md
      - How it works: development/how-it-works.md
      - Designing new sounds: development/designing-new-sounds.md
      - Designing for feel: development/designing-for-feel.md
      - Adding an effect: development/adding-an-effect.md
      - Shared library: development/pedalkit-lib.md
      - Tests and measurements: development/testing.md
      - Playing feel, CPU and stability: development/feel-cpu-stability.md
      - Schematics: development/schematics.md
      - Linting and CI: development/ci.md
      - Releasing: development/releasing.md
      - Logo: development/logo.md
  - Where this project sits: ecosystem.md
  - About: about.md
